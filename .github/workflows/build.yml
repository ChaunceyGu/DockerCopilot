name: build-and-push

# 触发条件：
# 1. 推送到 main 分支 —— 构建并推送 :latest
# 2. 打形如 v1.2.3 的 tag —— 构建并推送 :v1.2.3 和 :latest
# 3. 手动触发（Actions 页面的 Run workflow 按钮）
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 计算版本号与镜像 tag
      - name: Prepare metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot:${VERSION},${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot:latest"
          else
            VERSION="$(cat version 2>/dev/null || echo dev)"
            TAGS="${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot:latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "解析结果: version=${VERSION}  tags=${TAGS}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
